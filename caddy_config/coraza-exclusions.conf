# =============================================================
# Coraza WAF — Application-specific exclusions
# =============================================================

# [Rule 930120] LFI false positive on Google OAuth callback
# Google OAuth scope parameter contains ".profile" which triggers
# the OS File Access Attempt rule. Exclude the entire /oauth2/ path.
SecRule REQUEST_URI "@beginsWith /oauth2/" \
    "id:1001,phase:1,pass,nolog,ctl:ruleRemoveById=930120"

# [Rule 920420] Guacamole tunnel uses application/octet-stream for
# binary RDP/VNC/SSH stream data. Exclude the tunnel endpoint.
SecRule REQUEST_URI "@beginsWith /guacamole/tunnel" \
    "id:1002,phase:1,pass,nolog,ctl:ruleRemoveById=920420"

# [Rule 949110] Suppress anomaly score block triggered by 920420 above.
SecRule REQUEST_URI "@beginsWith /guacamole/tunnel" \
    "id:1003,phase:1,pass,nolog,ctl:ruleRemoveById=949110"

# [Webhook Exemptions] 
# Completely disable WAF for LINE and Telegram webhooks
# because incoming payloads might contain SQL snippets or scripts.
SecRule REQUEST_URI "@rx ^/webhook/(telegram|line)" \
    "id:1004,phase:1,pass,nolog,ctl:ruleEngine=Off"

# [Cockpit Exemption]
# Disable WAF engine for Cockpit because its internal resource naming
# (using @localhost) triggers SSRF false positives.
# This is safe as the path is already protected by SSO + Admin RBAC.
SecRule REQUEST_URI "@beginsWith /cockpit/" \
    "id:1005,phase:1,pass,nolog,ctl:ruleEngine=Off"
