# =============================================================
# Coraza WAF — Application-specific exclusions
# =============================================================

# [Rule 930120] LFI false positive on Google OAuth callback
# Google OAuth scope parameter contains ".profile" which triggers
# the OS File Access Attempt rule. Exclude the entire /oauth2/ path.
SecRule REQUEST_URI "@beginsWith /oauth2/" \
    "id:1001,phase:1,pass,nolog,ctl:ruleRemoveById=930120"
