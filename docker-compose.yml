services:
 # --- 1. 超級閘道器 Caddy ---
 caddy:
   build: ./build
   container_name: secure-gateway
   restart: unless-stopped
   # 網路共用 tailscale-gw sidecar 的 netns，Caddy 才能路由到 tailnet peer（MLX 後端 100.88.136.117）
   # 對外 ports 與 internal_bridge 已移到 tailscale-gw service
   network_mode: service:tailscale-gw
   environment:
     - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
     - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
     - AWS_HOSTED_ZONE_ID=${AWS_HOSTED_ZONE_ID}
     # [新增] Google OpenID 認證所需變數
     - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
     - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
     - JWT_SHARED_KEY=${JWT_SHARED_KEY}
     # [新增] 內部服務 IP 變數
     - SSH_SERVER_IP=${SSH_SERVER_IP}
     - COCKPIT_SERVER_IP=${COCKPIT_SERVER_IP}
     - DOMAIN_NAME=${DOMAIN_NAME}
     - CROWDSEC_BOUNCER_KEY=${CROWDSEC_BOUNCER_KEY}
     - ALLOWEDE_GMAIL=${ALLOWEDE_GMAIL}
     # [新增] cindy agent terminal 唯讀檢視群組 (sandboxview)
     - SANDBOXVIEW_GMAIL_1=${SANDBOXVIEW_GMAIL_1}
     - SANDBOXVIEW_GMAIL_2=${SANDBOXVIEW_GMAIL_2}
     - SANDBOXVIEW_GMAIL_3=${SANDBOXVIEW_GMAIL_3}
     # [新增] MLX OpenAI-compatible API 的存取金鑰
     - MLX_API_KEY=${MLX_API_KEY}
     # [新增] Synology DSM 管理主控台後端（NAS 自身 LAN IP，dsm7 子網域用）
     - DSM_SERVER_IP=${DSM_SERVER_IP}
     # [新增] Hermes VM（LINE webhook 上游，已從 Podman 容器遷至獨立 KVM VM）
     - HERMES_VM_IP=${HERMES_VM_IP}
   volumes:
     - ./caddy_config/Caddyfile:/etc/caddy/Caddyfile
     - ./caddy_config/coraza.conf:/etc/caddy/coraza.conf
     - ./caddy_config/coraza-exclusions.conf:/etc/caddy/coraza-exclusions.conf:ro
     #- ./caddy_config/crs/rules:/etc/caddy/owasp_crs:ro #CRS 改bake進image 
     - ./caddy_config/portal/users.json:/etc/caddy/portal/users.json
     - ./caddy_config/portal/custom.css:/etc/caddy/portal/custom.css:ro
     - ./caddy_config/portal/custom.js:/etc/caddy/portal/custom.js:ro
     - ./caddy_config/portal/assets:/etc/caddy/portal/assets:ro
     - caddy_data:/data
     - caddy_logs:/var/log/caddy
   depends_on:
     crowdsec:
       condition: service_started
     # netns 提供者必須先啟動；用 service_started（非 healthy）避免 tailscale 異常時連帶讓整個 gateway 起不來
     tailscale-gw:
       condition: service_started


 # --- 1b. Tailscale sidecar（提供 tailnet netns，讓 Caddy 連到 MLX 後端）---
 tailscale-gw:
   # 版本釘死（理由同 build/Dockerfile：浮動 tag 只會凍在本機快取，升級要有意識地改這裡再 compose pull）
   image: tailscale/tailscale:v1.104.4
   container_name: tailscale-gw
   hostname: secure-gateway-nas
   restart: unless-stopped
   cap_add:
     - NET_ADMIN
   devices:
     - /dev/net/tun
   environment:
     - TS_AUTHKEY=${TS_AUTHKEY}
     - TS_USERSPACE=false
     - TS_STATE_DIR=/var/lib/tailscale
     - TS_HOSTNAME=secure-gateway-nas
     # socket 放到 CLI 的預設路徑並掛進共用 volume，讓 derper 的 --verify-clients 問得到 tailscaled
     # （containerboot 預設是 /tmp/tailscaled.sock，別的容器碰不到）
     - TS_SOCKET=/var/run/tailscale/tailscaled.sock
   # 對外埠（Caddy 共用此 netns，實際監聽 :80/:443 的是 Caddy）
   # 註：8443（HTTPS）已移交 haproxy 分流器，Caddy 的 :443 改由它經 internal_bridge 轉入。
   #     :80 不需分流，維持直接對外。
   ports:
     - "8080:80"
     # 給走 host 網路的分流器回連用。刻意只綁 127.0.0.1：
     # 對外不可見，其他 bridge 上的容器也構不到，能偽造 PROXY 標頭的只剩 host 本機行程。
     - "127.0.0.1:8444:443"
   volumes:
     - tailscale_state:/var/lib/tailscale
     - tailscale_sock:/var/run/tailscale
   networks:
     - internal_bridge
   healthcheck:
     test: ["CMD", "tailscale", "status"]
     interval: 15s
     timeout: 5s
     retries: 6


 # --- 1d. 自架 DERP 中繼（derp.DOMAIN）---
 # 公司的 FortiGate 擋了 UDP（含 STUN 3478），公司裝置無法和 NAS 直連，只能走 DERP。
 # 官方 DERP 在國外，流量會繞出去再繞回來；中繼站放在 NAS 上，延遲就只剩公司到家這一段。
 # 走 443 → gateway-mux → Caddy derp.DOMAIN → 這裡，不需要任何 UDP，也不必對外開新的 port。
 # 不發佈 port，只掛 internal_bridge，由 Caddy 終止 TLS 後以 plain HTTP 轉進來。
 # 要在 Tailscale admin 的 ACL 裡加上 derpMap 才會被用到，見 CLAUDE.md。
 derper:
   build: ./build/derper
   container_name: derper
   restart: unless-stopped
   command:
     # 不是 :443、也沒有 -certmode manual → 只跑 plain HTTP（TLS 由 Caddy 負責）
     - -a=:8080
     - -http-port=-1
     # STUN 是 UDP，公司那端本來就打不通，也沒有對外發佈，關掉
     - -stun=false
     - -home=blank
     # 節點私鑰，存在 volume 裡，重建容器才不會變成一台新的中繼站
     - -c=/var/lib/derper/derper.key
     # 只讓本 tailnet 的節點使用，否則就是一台任何人都能用的公開中繼站。
     # 判斷方式是問 tailscale-gw 的 tailscaled 這個 node key 在不在它的 netmap 裡，
     # 所以 ACL 讓 tailscale-gw 看不到的節點也會被拒（那些節點本來就連不到 NAS，影響不大）。
     - -verify-clients
     - -socket=/var/run/tailscale/tailscaled.sock
   volumes:
     - derper_data:/var/lib/derper
     - tailscale_sock:/var/run/tailscale:ro
   networks:
     - internal_bridge
   depends_on:
     # 同樣用 service_started：tailscaled 還沒好時只是暫時驗證不了 client，client 會自動退回官方 DERP
     tailscale-gw:
       condition: service_started
   healthcheck:
     test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/generate_204"]
     interval: 30s
     timeout: 5s
     retries: 3


 # --- 1c. Port 443 協議分流器（SSH / HTTPS）---
 # office 封鎖 22 出站、只放行 443 且不能裝 Tailscale，故 443 需同時承載 SSH。
 # 刻意獨立成一個容器而非用 caddy-l4：分流邏輯與 L7 解耦，Caddyfile 幾乎不必更動，
 # rollback 只需把 8443:443 移回 tailscale-gw。
 haproxy:
   image: haproxy:3.0-alpine
   container_name: gateway-mux
   restart: unless-stopped
   # 不需要注入環境變數：SSH 後端已固定為 127.0.0.1:22（haproxy.cfg 的 presetenv 預設值，
   # 原因見該檔 be_ssh 的說明）。若哪天要把 443 的 SSH 分流轉給別台機器，
   # 在此加 environment: - MUX_SSH_BACKEND=${MUX_SSH_BACKEND} 並用 compose up 重建。
   # host 網路而非 docker 發佈埠：Synology 的 dockerd 未設 userland-proxy=false，
   # 發佈埠會把來源位址改寫成橋接閘道 172.21.0.1。實測（區網直連、不經路由器）
   # 連 haproxy 自己收到的都已經是 172.21.0.1，PROXY protocol 只是忠實地把一個
   # 早就錯掉的 IP 往下傳 → CrowdSec 對真實攻擊來源全盲、rate_limit 塌成單一水桶。
   # 直接綁 host :8443 才拿得到真實 client IP，再經 PROXY protocol 交給 Caddy。
   # 註：:80 那條（tailscale-gw 8080:80）仍會被改寫，但它只負責 HTTP→HTTPS 轉址，不在乎來源。
   network_mode: host
   volumes:
     - ./haproxy_config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
   depends_on:
     # 與 Caddy 同理，用 service_started：tailscale 異常不該讓整個 443 起不來
     # （後端是固定的 127.0.0.1:8444，tailscale-gw 還沒好時 health check 失敗即可，不擋啟動）
     tailscale-gw:
       condition: service_started


 # --- 2. 威脅防禦 CrowdSec ---
 crowdsec:
   # 版本釘死，理由同上。升 minor 前先看 release notes 的 breaking changes
   image: crowdsecurity/crowdsec:v1.8.2
   container_name: crowdsec
   restart: unless-stopped
   environment:
     - COLLECTIONS=crowdsecurity/caddy crowdsecurity/http-cve
   volumes:
     - crowdsec_db:/var/lib/crowdsec/data
     - ./crowdsec_config:/etc/crowdsec
     - caddy_logs:/var/log/caddy:ro # 讀取 Caddy 的 Log
   networks:
     - internal_bridge


 # --- 3. Guacamole 核心 (Web App) ---
 guacamole:
   # 版本釘死。升級前須先套用該版的 schema/upgrade/upgrade-pre-<ver>.sql（在映像內
   # /opt/guacamole/extensions/guacamole-auth-jdbc/postgresql/schema/upgrade/），並先 pg_dump 備份
   image: guacamole/guacamole:1.6.0
   container_name: guacamole
   restart: unless-stopped
   environment:
     - GUACD_HOSTNAME=guacd
     - POSTGRESQL_HOSTNAME=postgres
     - POSTGRESQL_DATABASE=guacamole_db
     - POSTGRESQL_USERNAME=guacamole_user # 1.6.0 起 POSTGRESQL_USER 已棄用
     - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
     - TOTP_ENABLED=true # 啟用 2FA (需配合 extensions)
     # 1.6.0 預設啟用 ban 擴充（暴力破解封鎖）。Guacamole 只看得到 Caddy 的橋接 IP，
     # 不開 RemoteIpValve 的話所有人共用一個計數，任何人輸錯幾次就把大家一起鎖住。
     # 開啟後改採 Caddy 送的 X-Forwarded-For（Tomcat 預設 internalProxies 已涵蓋 172.16.0.0/12）
     - REMOTE_IP_VALVE_ENABLED=true
     # start.sh 把 GUACAMOLE_HOME 視為模板，啟動時整份複製進 runtime home
     # (~/.guacamole)，第三方擴充 jar 才會被載入
     - GUACAMOLE_HOME=/etc/guacamole
   volumes:
     # 舊掛載點 /opt/guacamole/extensions 不會被 start.sh 讀取（無效）；1.6.0 的
     # entrypoint.d/100-generate-guacamole-home.sh 仍以 GUACAMOLE_HOME 為模板連結 extensions
     - ./guac_extensions:/etc/guacamole/extensions:ro
   depends_on:
     guacd:
       condition: service_started
     postgres:
       condition: service_healthy
   networks:
     - internal_bridge


 # --- 4. Guacd (Protocol Proxy) ---
 guacd:
   # 須與 guacamole 同版本
   image: guacamole/guacd:1.6.0
   container_name: guacd
   restart: unless-stopped
   networks:
     - internal_bridge


 # --- 5. Postgres (Database) ---
 postgres:
   image: postgres:15-alpine
   container_name: guac_postgres
   restart: unless-stopped
   environment:
     - POSTGRES_USER=guacamole_user
     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
     - POSTGRES_DB=guacamole_db
   volumes:
     - postgres_data:/var/lib/postgresql/data
   networks:
     - internal_bridge
   healthcheck:
     test: ["CMD-SHELL", "pg_isready -U guacamole_user -d guacamole_db"]
     interval: 10s
     timeout: 5s
     retries: 5


networks:
 internal_bridge:
   driver: bridge

volumes:
  caddy_data:
  caddy_logs:
  crowdsec_db:
  postgres_data:
  tailscale_state:
  # tailscaled 的 LocalAPI socket，tailscale-gw 讀寫、derper 唯讀掛載
  tailscale_sock:
  derper_data:
