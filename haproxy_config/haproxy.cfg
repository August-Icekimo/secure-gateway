# --- Port 443 協議分流器 ---
# 對外 443 同時承載 SSH 與 HTTPS：讀連線開頭幾個 byte 判斷協議後分流。
# 需求背景：office 網路封鎖 22 出站、只放行 443，且該環境無法安裝 Tailscale。
#
# 流量：router NAT 443 → NAS:8443（本容器走 host 網路，直接綁在此）
#         ├─ "SSH-" banner → {$SSH_SERVER_IP}:22
#         └─ TLS ClientHello → 127.0.0.1:8444 → tailscale-gw:443（Caddy 共用該 netns）

global
    log stdout format raw local0 info
    # 環境變數由 compose 注入，用 "${VAR}" 在設定檔中展開
    .if !defined(SSH_SERVER_IP)
        .alert "SSH_SERVER_IP 未設定，分流器無法決定 SSH 後端"
    .endif

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    # SSH 是長閒置連線（開著 terminal 去吃飯），逾時設短會被無預警砍線。
    # 搭配 tcpka 讓中間設備不會誤判連線已死。
    timeout client 24h
    timeout server 24h
    option clitcpka
    option srvtcpka

frontend fe_443
    # 綁非特權 port：haproxy 官方 image 以非 root 的 haproxy user 執行，綁 :443 會 permission denied。
    # 本容器走 host 網路，故此處是直接綁在 NAS 主機的 :8443 上，不再經 docker 發佈埠
    # （那層會把來源位址改寫掉，正是本次要修的問題）。對外行為不變（router NAT 進來的仍是 443）。
    bind :8443

    # 等待 client 送出足夠 byte 來判斷協議。SSH client 連上後會立即送
    # "SSH-2.0-..." 識別字串（RFC 4253），TLS client 則送 ClientHello。
    tcp-request inspect-delay 5s
    acl is_ssh req.payload(0,4) -m bin 5353482d
    acl is_tls req.ssl_hello_type 1

    # 既非 SSH 也非 TLS 的流量在 L4 就丟掉，不往後端送
    tcp-request content accept if is_ssh
    tcp-request content accept if is_tls
    tcp-request content reject

    use_backend be_ssh if is_ssh
    default_backend be_caddy

backend be_ssh
    # sshd 不懂 PROXY protocol，故不加 send-proxy-v2。
    # 代價：後端 sshd 只會看到本容器 IP，該機的 fail2ban / auth log 形同失效，
    # 且 CrowdSec 只讀 caddy log、對此路徑全盲 → 後端務必 key-only 認證。
    server ssh ${SSH_SERVER_IP}:22

backend be_caddy
    # send-proxy-v2 保留真實 client IP：Caddy 的 rate_limit 用 {remote_host} 當 key、
    # 各 site block 都掛 crowdsec，少了它會讓所有請求看起來都來自本容器，
    # rate limit 塌成單一水桶，CrowdSec 也再看不到真正的攻擊來源。
    #
    # 本容器走 host 網路（見 docker-compose.yml 的說明），所以不再用 docker DNS 解析
    # tailscale-gw，改連它發佈在 host loopback 上的 127.0.0.1:8444 → 容器內 :443。
    # 位址是固定字面值，tailscale-gw 重建後 IP 換掉也不影響，不需要 resolvers。
    server caddy 127.0.0.1:8444 send-proxy-v2 check
